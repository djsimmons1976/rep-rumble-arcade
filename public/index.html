<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rep Rumble">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Rep Rumble Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg-void:#08060c; --panel:#000000; --line:#2b2838;
    --hot-pink:#ff2f7e; --gold:#ffc93c; --violet:#9b5cff; --mint:#34e8a0;
    --text:#f2f0f5; --muted:#8a8794; --danger:#ff5252; --sky:#3ec6ff; --green:#3fbf5f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Space Mono', monospace; color:var(--text);
    background:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.06) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.05) 0 1px, transparent 1px),
      radial-gradient(circle at 40% 85%, rgba(255,255,255,0.05) 0 1px, transparent 1px),
      radial-gradient(circle at 90% 15%, rgba(255,255,255,0.05) 0 1px, transparent 1px),
      var(--bg-void);
    background-size: 140px 140px, 180px 180px, 160px 160px, 200px 200px, 100% 100%;
    min-height:100vh; padding:18px;
  }
  #app{max-width:520px;margin:0 auto;}
  .pixel{font-family:'Press Start 2P', monospace;}
  .eyebrow{color:var(--hot-pink); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin:0 0 6px 0;}
  .title{font-size:26px; line-height:1.4; margin:0 0 16px 0; text-transform:uppercase;}
  .rule{height:3px; background:var(--hot-pink); border:none; margin:14px 0 20px 0;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px;}
  .row{display:flex; gap:12px;}
  .row > *{flex:1;}
  input[type=text], input[type=number], select{
    width:100%; background:#0d0b14; border:1px solid var(--line); color:var(--text);
    font-family:'Space Mono', monospace; font-size:15px; padding:12px; border-radius:3px;
  }
  input:focus, select:focus{outline:2px solid var(--hot-pink);}
  .radio-group{display:flex; gap:8px; margin-bottom:12px;}
  .radio-opt{flex:1; text-align:center; padding:10px 4px; border:1px solid var(--line); border-radius:3px; font-size:11px; text-transform:uppercase; cursor:pointer; color:var(--muted); line-height:1.3;}
  .radio-opt.active{border-color:var(--hot-pink); color:var(--text); background:rgba(255,47,126,0.08);}
  button{font-family:'Space Mono', monospace; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer; border-radius:3px; border:1px solid var(--line); background:#111017; color:var(--text); padding:12px 16px; transition:transform .05s ease;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--hot-pink); border-color:var(--hot-pink); color:#0a0a0a;}
  .btn-violet{background:var(--violet); border-color:var(--violet); color:#0a0a0a;}
  .btn-sky{background:var(--sky); border-color:var(--sky); color:#0a0a0a;}
  .btn-green{background:var(--green); border-color:var(--green); color:#0a0a0a;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--muted); font-size:12px; padding:8px 12px;}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger); font-size:11px; padding:8px 12px;}
  .btn-small{font-size:10px; padding:6px 10px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .stat-box{background:var(--panel); border:2px solid var(--text); border-radius:4px; padding:10px 14px; text-align:center; min-width:100px;}
  .stat-box.urgent{border-color:var(--danger); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,.5);} 50%{box-shadow:0 0 0 6px rgba(255,82,82,0);}}
  .stat-label{font-size:9px; color:var(--muted); letter-spacing:1px; margin-bottom:4px;}
  .stat-value{font-family:'Press Start 2P'; font-size:20px; color:var(--text);}
  .setup-section{margin-bottom:14px;}
  .setup-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .setup-label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted);}
  .ex-pick-list{display:flex; flex-direction:column; gap:6px;}
  .ex-pick-row{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:3px; font-size:12px;}
  .ex-pick-row input[type=checkbox]{width:auto; margin:0;}
  .ex-pick-name{flex:1; text-transform:uppercase;}
  .ex-mini-input{width:56px !important; padding:6px !important; font-size:11px !important; text-align:center;}
  .ex-mini-label{font-size:9px; color:var(--muted); display:block; text-align:center; margin-bottom:2px;}
  .ex-setup-card{border:1px solid var(--line); border-radius:4px; padding:12px; margin-bottom:8px;}
  .ex-setup-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .ex-setup-head input[type=checkbox]{width:auto; margin:0;}
  .ex-setup-name{flex:1; text-transform:uppercase; font-weight:700; font-size:13px;}
  .ex-setup-fields{display:flex; gap:8px; flex-wrap:wrap;}
  .ex-setup-fields > div{flex:1; min-width:70px;}
  .ex-setup-fields select{padding:8px; font-size:12px;}
  .ex-name-input{flex:1; min-width:0; font-weight:700; text-transform:uppercase; font-size:13px !important; padding:8px !important;}
  .reps-stepper{display:flex; align-items:stretch; gap:6px;}
  .reps-stepper-btn{flex:0 0 52px; font-size:22px; padding:10px 0; line-height:1;}
  .reps-stepper-input{flex:1; min-width:70px; text-align:center; font-size:20px !important; font-weight:700; padding:10px !important;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
  @media (max-width:400px){ .grid{grid-template-columns:1fr;} }
  .ex-card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .ex-top{display:flex; justify-content:space-between; align-items:baseline;}
  .ex-name{font-size:13px; text-transform:uppercase; font-weight:700;}
  .ex-pts{font-size:11px; color:var(--gold);}
  .ex-boost{font-size:9px; color:var(--sky);}
  .ex-bar-track{height:5px; background:#1c1a24; border-radius:3px; overflow:hidden;}
  .ex-bar-fill{height:100%; background:var(--mint); transition:width .2s ease;}
  .ex-controls{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ex-tap{flex:1; background:#161320; border:1px solid var(--line); color:var(--text); padding:10px; font-size:12px;}
  .ex-tap:active{background:var(--hot-pink); color:#0a0a0a;}
  .ex-minus{width:32px; padding:10px 0; font-size:14px; color:var(--muted);}
  .score-panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:18px; margin-bottom:16px;}
  .score-label{font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;}
  .score-value{font-family:'Press Start 2P'; font-size:36px; color:var(--gold);}
  .team-tag{display:inline-block; margin-top:6px; font-size:11px; color:var(--violet); text-transform:uppercase;}
  .mission-panel{border:3px solid var(--violet); border-radius:4px; padding:16px; margin-bottom:16px; background:var(--panel);}
  .mission-panel.complete{border-color:var(--mint);}
  .mission-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .mission-eyebrow{color:var(--hot-pink); font-size:10px; letter-spacing:2px; text-transform:uppercase;}
  .mission-title{font-size:16px; text-transform:uppercase; font-weight:700; margin:2px 0 8px 0;}
  .mission-progress{font-family:'Press Start 2P'; color:var(--violet); font-size:16px;}
  .mission-panel.complete .mission-progress{color:var(--mint);}
  .mission-sub{font-size:11px; color:var(--muted); margin-bottom:10px;}
  .mission-list{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:11px;}
  .mission-item{display:flex; justify-content:space-between; color:var(--muted);}
  .mission-item.done{color:var(--mint);}
  .mission-bonus{margin-top:12px; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .leaderboard{margin-bottom:14px;}
  .lb-title{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .lb-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:3px; margin-bottom:6px; font-size:13px;}
  .lb-row.me{border-color:var(--hot-pink); background:rgba(255,47,126,0.06);}
  .lb-row.team{border-color:var(--violet); background:rgba(155,92,255,0.06);}
  .lb-rank{color:var(--muted); min-width:24px; margin-right:8px; white-space:nowrap;}
  .lb-name{flex:1; text-transform:uppercase; font-weight:700;}
  .lb-sub{font-size:10px; color:var(--muted); font-weight:400; margin-left:6px;}
  .lb-badge{font-size:10px; color:var(--mint); margin-left:6px;}
  .lb-score{color:var(--gold); font-family:'Press Start 2P'; font-size:13px;}
  .footer-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; flex-wrap:wrap;}
  .empty{color:var(--muted); font-size:12px; text-align:center; padding:12px;}
  .banner{text-align:center; padding:10px; border-radius:4px; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:14px;}
  .banner.timeup{background:rgba(255,82,82,0.12); color:var(--danger); border:1px solid var(--danger);}
  .banner.won{background:rgba(52,232,160,0.12); color:var(--mint); border:1px solid var(--mint);}
  .banner.boost{background:rgba(62,198,255,0.12); color:var(--sky); border:1px solid var(--sky);}
  .lobby-list{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .lobby-chip{border:1px solid var(--line); border-radius:20px; padding:6px 14px; font-size:12px; text-transform:uppercase; color:var(--text); background:#111017;}
  .spinner-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--hot-pink); margin-right:6px; animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:.2;} 50%{opacity:1;}}
  .game-card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:12px; cursor:pointer;}
  .game-card:active{transform:scale(0.99);}
  .game-card-title{font-size:15px; text-transform:uppercase; font-weight:700; margin-bottom:6px;}
  .game-card-tag{font-size:12px; color:var(--muted); line-height:1.5;}
  .bullet-list{margin:12px 0; padding:0; list-style:none;}
  .bullet-list li{font-size:12px; color:var(--muted); padding-left:16px; position:relative; margin-bottom:8px; line-height:1.4;}
  .bullet-list li:before{content:"\2726"; position:absolute; left:0; color:var(--sky);}
  .lap-btn{width:100%; padding:22px; font-size:16px; background:linear-gradient(90deg,var(--green),var(--mint)); border:none; color:#06210f; margin-bottom:16px;}
  .shell-panel{border:3px solid var(--danger); border-radius:4px; padding:16px; margin-bottom:16px; background:var(--panel);}
  .shell-eyebrow{color:var(--danger); font-size:10px; letter-spacing:2px; text-transform:uppercase;}
  .code-display{font-family:'Press Start 2P'; font-size:42px; letter-spacing:6px; color:var(--sky); text-align:center; padding:20px 0;}
  .code-input{font-family:'Press Start 2P' !important; font-size:22px !important; letter-spacing:8px !important; text-align:center; text-transform:uppercase;}
  .big-choice{width:100%; padding:20px; margin-bottom:12px; font-size:14px;}
  /* ---- projector / big screen ---- */
  .q-topline{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin:10px 0 4px 0;}
  .q-code-small{font-family:'Press Start 2P'; font-size:clamp(14px,1.6vw,26px); color:var(--sky); letter-spacing:4px;}
  .q-timer-wrap{text-align:center; margin:4px 0 16px 0;}
  .q-timer-label{font-size:clamp(12px,1.4vw,22px); color:var(--muted); letter-spacing:4px; text-transform:uppercase; margin-bottom:6px;}
  .q-timer{display:inline-block; padding:4px 44px; border-radius:14px; font-family:'Press Start 2P'; font-size:clamp(44px,7vw,130px); line-height:1.15; color:var(--text);}
  .q-timer.urgent{color:var(--danger); animation:pulse 1s infinite;}
  .q-grid{display:grid; grid-template-columns:1fr; gap:16px; align-items:start;}
  @media (min-width:1100px){ .q-grid{grid-template-columns:1.3fr 1fr;} }
  .prog-card{background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:12px;}
  .prog-name{font-weight:700; text-transform:uppercase; font-size:clamp(14px,1.8vw,30px); margin-bottom:6px;}
  .bar-row{display:flex; align-items:center; gap:12px; margin:8px 0;}
  .bar-label{flex:0 0 clamp(64px,7vw,130px); font-size:clamp(11px,1.2vw,20px); color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .bar-trk{flex:1; height:clamp(18px,2.4vw,38px); background:#1c1a24; border-radius:6px; overflow:hidden;}
  .bar-fil{height:100%; border-radius:6px; transition:width .7s ease;}
  .bar-val{flex:0 0 clamp(70px,8vw,150px); text-align:right; font-family:'Press Start 2P'; font-size:clamp(10px,1.2vw,22px);}
  /* ---- game over ---- */
  .end-flash{position:fixed; top:0; left:0; right:0; bottom:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; animation:endPulse 0.8s ease-in-out infinite; transition:opacity .6s ease;}
  .end-flash.fade{opacity:0;}
  @keyframes endPulse{0%{background:#ff0000;} 50%{background:#5a0000;} 100%{background:#ff0000;}}
  .end-flash-text{font-family:'Press Start 2P'; font-size:clamp(28px,9vw,130px); line-height:1.3; color:#fff; text-shadow:0 0 24px #000;}
  .end-flash-sub{font-family:'Press Start 2P'; font-size:clamp(14px,3vw,48px); color:#fff; margin-top:18px; letter-spacing:4px;}
  .final-title{font-family:'Press Start 2P'; text-align:center; font-size:clamp(20px,4vw,56px); line-height:1.4; margin:14px 0 10px 0;}
  .final-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width:1000px){ .final-grid.wide{grid-template-columns:1fr 1fr;} }
  .winner-banner{text-align:center; padding:14px; border:2px solid var(--gold); border-radius:6px; background:linear-gradient(90deg, rgba(255,201,60,0.15), rgba(255,47,126,0.15)); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; font-size:clamp(13px,1.6vw,28px);}
  .rank-row{margin-bottom:16px;}
  .rank-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .rank-medal{flex:0 0 auto; font-size:clamp(16px,2vw,34px);}
  .rank-medal .podium-emoji{font-size:inherit; margin-right:6px;}
  .final-grid.wide .rank-row{margin-bottom:28px;}
  .final-grid.wide .rank-name{font-size:clamp(16px,2.4vw,46px);}
  .final-grid.wide .rank-val{font-size:clamp(12px,1.6vw,32px);}
  .final-grid.wide .rank-medal{font-size:clamp(18px,2.6vw,50px);}
  .final-grid.wide .bar-trk{height:clamp(26px,3.2vw,60px);}
  .winner-banner.wide{font-size:clamp(16px,2.3vw,42px); padding:20px;}
  .rank-name{flex:1; font-weight:700; text-transform:uppercase; font-size:clamp(14px,1.8vw,32px);}
  .rank-val{font-family:'Press Start 2P'; font-size:clamp(11px,1.3vw,24px); color:var(--gold);}
  .checkered-strip{
    height:14px; margin:10px 0 18px 0; border-radius:2px;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff);
    background-size: 14px 14px; background-position: 0 0, 7px 7px; background-color:#0a0a0a;
  }
  .podium-emoji{ font-size:14px; margin-right:4px; }
  .trophy-banner{
    text-align:center; padding:14px; margin-bottom:16px; border-radius:4px;
    background:linear-gradient(90deg, rgba(255,201,60,0.15), rgba(255,47,126,0.15));
    border:1px solid var(--gold); font-size:13px; text-transform:uppercase; letter-spacing:1px;
  }
  .challenge-icon-wrap{ text-align:center; margin-bottom:8px; }
  .challenge-label{ text-align:center; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .challenge-exercise-huge{
    text-align:center; font-size:34px; line-height:1.25; font-weight:700; color:#ffffff;
    text-shadow:0 0 8px rgba(0,0,0,0.6); margin-bottom:10px; word-break:break-word;
  }
  .challenge-progress{ text-align:center; font-size:15px; color:var(--text); margin-bottom:14px; }
  .btn-huge{ width:100%; padding:22px; font-size:20px; }
  .difficulty-btn{
    width:100%; text-align:center; cursor:pointer; padding:26px 10px; margin-bottom:10px;
    border-radius:6px; border:3px solid var(--line); text-transform:uppercase; font-weight:700;
    font-size:26px; letter-spacing:1px; background:#0d0b14;
  }
  .difficulty-btn.selected{ background:rgba(255,255,255,0.06); }
</style>

<script>
// ---------- storage adapter: same interface as the Claude artifact's window.storage,
// backed by our own tiny API (shared data) and localStorage (personal data) ----------
(function(){
  async function apiGet(key){
    var res = await fetch('/api/kv/' + encodeURIComponent(key));
    if(res.status === 404) throw new Error('not found: ' + key);
    if(!res.ok) throw new Error('storage GET failed (' + res.status + ')');
    var data = await res.json();
    return { key: key, value: data.value, shared: true };
  }
  async function apiSet(key, value){
    var res = await fetch('/api/kv/' + encodeURIComponent(key), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: value })
    });
    if(!res.ok) throw new Error('storage SET failed (' + res.status + ')');
    return { key: key, value: value, shared: true };
  }
  async function apiDelete(key){
    var res = await fetch('/api/kv/' + encodeURIComponent(key), { method: 'DELETE' });
    if(!res.ok) throw new Error('storage DELETE failed (' + res.status + ')');
    return { key: key, deleted: true, shared: true };
  }
  async function apiList(prefix){
    var res = await fetch('/api/kv-list?prefix=' + encodeURIComponent(prefix || ''));
    if(!res.ok) throw new Error('storage LIST failed (' + res.status + ')');
    var data = await res.json();
    return { keys: data.keys, prefix: prefix, shared: true };
  }

  window.storage = {
    get: async function(key, shared){
      if(!shared){
        var v = localStorage.getItem(key);
        if(v === null) throw new Error('not found: ' + key);
        return { key: key, value: v, shared: false };
      }
      return apiGet(key);
    },
    set: async function(key, value, shared){
      if(!shared){ localStorage.setItem(key, value); return { key: key, value: value, shared: false }; }
      return apiSet(key, value);
    },
    delete: async function(key, shared){
      if(!shared){ localStorage.removeItem(key); return { key: key, deleted: true, shared: false }; }
      return apiDelete(key);
    },
    list: async function(prefix, shared){
      if(!shared){
        var keys = [];
        for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if(!prefix || k.indexOf(prefix)===0) keys.push(k); }
        return { keys: keys, prefix: prefix, shared: false };
      }
      return apiList(prefix);
    }
  };
})();
</script>

  function playAlertTone(){
    if(audioCtx && audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
    if(!audioCtx) return;
    try{
      var now = audioCtx.currentTime;
      [0, 0.16, 0.32].forEach(function(offset, i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = (i % 2 === 0) ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.16);
      });
    }catch(e){ console.error('alert tone failed', e); }
  }

  async function performShuffle(numTeams){
    await fetchLeaderboard();
    var pool = state.leaderboard.filter(function(e){ return e.mode === 'random'; });
    if(pool.length < numTeams){ alert('Need at least '+numTeams+' PAX joined before shuffling.'); return; }
    var arr = pool.slice();
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
    var assignments = {};
    var groups = {};
    arr.forEach(function(entry, idx){
      var pid = entry._key.replace(K('leaderboard:'),'');
      var teamName = teamNameForIndex(idx % numTeams);
      assignments[pid] = teamName;
      var slug = teamSlug(teamName);
      if(!groups[slug]) groups[slug] = [];
      groups[slug].push(pid);
    });
    var teamsObj = { assignments: assignments, numTeams: numTeams, shuffledAt: Date.now() };
    try{ await window.storage.set(K('teams'), JSON.stringify(teamsObj), true); }catch(e){ console.error(e); return; }
    state.teamsInfo = teamsObj;
    for(var slugKey in groups){
      var racerState = { order: groups[slugKey], currentIndex: 0 };
      try{ await window.storage.set(K('racer:'+slugKey), JSON.stringify(racerState), true); }catch(e){ console.error(e); }

    render();
  }

      try{ var r2 = await window.storage.get(K('pcbonus:'+slug), true); pcbonus = (r2 && r2.value) ? parseFloat(r2.value) : 0; }catch(e){ pcbonus = 0; }
      try{ var r3 = await window.storage.get(K('racer:'+slug), true); racer = (r3 && r3.value) ? JSON.parse(r3.value) : null; }catch(e){ racer = null; }
      try{ var r4 = await window.storage.get(K('meter:'+slug), true); meter = (r4 && r4.value) ? parseFloat(r4.value) : 0; }catch(e){ meter = 0; }
      try{ var r5 = await window.storage.get(K('challenge:'+slug), true); challenge = (r5 && r5.value) ? JSON.parse(r5.value) : null; }catch(e){ challenge = null; }
      var shortcut = null;
      try{ var r6 = await window.storage.get(K('shortcut:'+slug), true); shortcut = (r6 && r6.value) ? JSON.parse(r6.value) : null; }catch(e){ shortcut = null; }
      data[slug] = { name: teams[slug].name, laps: laps, pcbonus: pcbonus, racer: racer, meter: meter, challenge: challenge, shortcut: shortcut };
    }
    state.teamData = data;
  }

  async function refreshMyChallenge(){
    if(!state.team){ state.myChallenge = null; return; }
    var slug = teamSlug(state.team);
    var prevAt = state.myChallenge ? state.myChallenge.issuedAt : null;
    try{ var r = await window.storage.get(K('challenge:'+slug), true); state.myChallenge = (r && r.value) ? JSON.parse(r.value) : null; }
    catch(e){ state.myChallenge = null; }
    if(state.myChallenge && state.myChallenge.issuedAt !== prevAt){
      var fromWho = state.myChallenge.fromTeam ? (state.myChallenge.fromTeam + ' hit your team!') : 'Your team got hit with a power-up!';
      notifyPowerupHit(fromWho);
    }
  }

  function lapInfoFor(slug){
    var td = state.teamData[slug];
    if(!td || !state.session || !state.session.startTime) return {completed:0, fraction:0, total:0};
    // Laps and partial laps freeze at the final whistle so the final standings never move.
    var endAt = state.session.startTime + (state.session.durationSec || 0) * 1000;
    var lapsDone = td.laps.filter(function(t){ return t <= endAt; });
    var completed = lapsDone.length;
    if(completed === 0) return {completed:0, fraction:0, total:0};
    var now = Math.min(Date.now(), endAt);
    var elapsedNow = (now - state.session.startTime)/1000;
    var avg = elapsedNow/completed;
    var lastLapTime = (lapsDone[completed-1] - state.session.startTime)/1000;
    var sinceLast = elapsedNow - lastLapTime;
    var fraction = avg > 0 ? Math.min(0.99, sinceLast/avg) : 0;
    return {completed:completed, fraction:fraction, total: completed+fraction};
  }

  function lapStandings(){
    var arr = [];
    Object.keys(state.teamData).forEach(function(slug){
      var info = lapInfoFor(slug);
      arr.push({name: state.teamData[slug].name, laps: info.total, completed: info.completed});
    });
    arr.sort(function(a,b){ return b.laps - a.laps; });
    return arr;
  }

  function renderTrackView(){
    var slugs = Object.keys(state.teamData);
    if(slugs.length === 0) return '<div class="empty">No teams on the track yet.</div>';
    var cx = 420, cy = 250, rx = 320, ry = 150;
    var svg = '<svg viewBox="0 0 840 500" style="width:100%; height:auto; display:block;">';
    svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="#2b2838" stroke-width="64"/>';
    svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="#55506a" stroke-width="2" stroke-dasharray="10 10"/>';
    svg += '<rect x="'+(cx-4)+'" y="'+(cy-ry-32)+'" width="8" height="64" fill="#fff"/>';
    svg += '<text x="'+cx+'" y="'+(cy-ry+78)+'" text-anchor="middle" font-size="15" fill="#8a8794" style="font-family:monospace; letter-spacing:3px;">&#9650; START / FINISH</text>';
    var stable = slugs.slice().sort();      // a fixed order, so labels don't jump around as scores change
    stable.forEach(function(slug, idx){
      var td = state.teamData[slug];
      var info = lapInfoFor(slug);
      var flair = teamFlair(td.name);
      var angle = (info.fraction * Math.PI * 2) - (Math.PI/2);
      var x = cx + rx * Math.cos(angle);
      var y = cy + ry * Math.sin(angle);
      svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="24" fill="'+flair.color+'" stroke="#000" stroke-width="3"/>';
      svg += '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="22">'+flair.emoji+'</text>';
      var stack = idx % 2;
      var labelY = (y <= cy) ? (y - 38 - stack*26) : (y + 50 + stack*26);
      var anchor = x < 240 ? 'start' : (x > 600 ? 'end' : 'middle');
      var labelX = anchor === 'start' ? Math.max(8, x - 24) : (anchor === 'end' ? Math.min(832, x + 24) : x);
      svg += '<text x="'+labelX.toFixed(1)+'" y="'+labelY.toFixed(1)+'" text-anchor="'+anchor+'" font-size="19" font-weight="700" fill="'+flair.color+'" stroke="#000" stroke-width="4" paint-order="stroke" style="font-family:monospace; text-transform:uppercase;">'+td.name+' &middot; L'+info.completed+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function renderTeamMetersBig(){
    var slugs = Object.keys(state.teamData);

    var html = '<div class="card" style="margin-bottom:16px;"><div class="setup-label" style="margin-bottom:10px;">Team Power Meters</div>';

        '<div class="ex-bar-track" style="height:12px;"><div class="ex-bar-fill" style="width:'+meter+'%; background:'+flair.color+';"></div></div></div>';

  function pitStandings(){
    var totals = {};
    state.leaderboard.forEach(function(e){
      if(e.team){
        var slug = teamSlug(e.team);
        if(!totals[slug]) totals[slug] = {name:e.team.trim(), score:0};
        totals[slug].score += e.score;
      }
    });
    Object.keys(state.teamData).forEach(function(slug){
      if(!totals[slug]) totals[slug] = {name:state.teamData[slug].name, score:0};
      totals[slug].score += state.teamData[slug].pcbonus || 0;
    });
    var arr = []; for(var k in totals){ arr.push(totals[k]); }
    arr.sort(function(a,b){ return b.score - a.score; });

  function nextRunnerNameFor(td){
    if(!td || !td.racer || !td.racer.order || !td.racer.order.length) return 'your next runner';
    return nameForId(td.racer.order[nextRunnerIndex(td.racer)]);
  }
  function currentRunnerNameFor(td){
    if(!td || !td.racer || !td.racer.order || !td.racer.order.length) return 'their runner';
    return nameForId(td.racer.order[td.racer.currentIndex % td.racer.order.length]);
  }

  // A Rocket that is "pending" becomes active for whoever is now up; one that is active is used up.
  async function advanceShortcut(slug, newRunnerId, runnerFinishedLap){
    var sc = null;
    try{ var r = await window.storage.get(K('shortcut:'+slug), true); sc = (r && r.value) ? JSON.parse(r.value) : null; }catch(e){ sc = null; }
    if(!sc) return;
    if(sc.state === 'pending'){
      sc.state = 'active'; sc.activatedAt = Date.now();
      try{ await window.storage.set(K('shortcut:'+slug), JSON.stringify(sc), true); }catch(e){}
      if(newRunnerId){ sendPush([newRunnerId], '\uD83D\uDE80 You\'re up with the ' + powerupById('rocket').label + '!', 'Take the half-lap shortcut on your lap.', 'shortcut'); }
    } else if(runnerFinishedLap){
      try{ await window.storage.delete(K('shortcut:'+slug), true); }catch(e){}
    }
  }

  function isSittingOut(pid){
    var out = false;
    state.leaderboard.forEach(function(e){ if(e._key === K('leaderboard:'+pid) && e.skipRuns) out = true; });
    return out;
  }

  // Next runner in the fixed order, passing over anyone who is sitting out runs (injuries).
  function nextRunnerIndex(rs){
    var n = rs.order.length;
    for(var step = 1; step <= n; step++){
      var idx = (rs.currentIndex + step) % n;
      if(!isSittingOut(rs.order[idx])) return idx;
    }
    return (rs.currentIndex + 1) % n;
  }

  async function completeLap(){
    if(!state.team) return;
    var tlL = timeLeftSec(); if(tlL !== null && tlL <= 0) return;
    var slug = teamSlug(state.team);
    var arr = [];
    try{ var r = await window.storage.get(K('laps:'+slug), true); arr = (r && r.value) ? JSON.parse(r.value) : []; }catch(e){ arr = []; }
    arr.push(Date.now());
    try{ await window.storage.set(K('laps:'+slug), JSON.stringify(arr), true); }catch(e){ console.error(e); }
    var rs = null;
    try{ var rr = await window.storage.get(K('racer:'+slug), true); rs = (rr && rr.value) ? JSON.parse(rr.value) : null; }catch(e){ rs = null; }
    if(rs && rs.order && rs.order.length){
      rs.currentIndex = nextRunnerIndex(rs);
      try{ await window.storage.set(K('racer:'+slug), JSON.stringify(rs), true); }catch(e){ console.error(e); }
    }
    await advanceShortcut(slug, (rs && rs.order && rs.order.length) ? rs.order[rs.currentIndex % rs.order.length] : null, true);
    await refreshTeamsData();
    render();
  }

  // Hand the baton to the next runner WITHOUT logging a lap.
  async function skipTurn(){
    if(!state.team) return;
    var tlS = timeLeftSec(); if(tlS !== null && tlS <= 0) return;
    var slug = teamSlug(state.team);
    var rs = null;
    try{ var rr = await window.storage.get(K('racer:'+slug), true); rs = (rr && rr.value) ? JSON.parse(rr.value) : null; }catch(e){ rs = null; }
    if(!rs || !rs.order || !rs.order.length) return;
    if(rs.order[rs.currentIndex % rs.order.length] !== state.devicePlayerId){ await refreshTeamsData(); render(); return; }
    var next = nextRunnerIndex(rs);
    if(next === rs.currentIndex){ alert('Nobody else on your team is available to run right now.'); return; }
    rs.currentIndex = next;
    try{ await window.storage.set(K('racer:'+slug), JSON.stringify(rs), true); }catch(e){ console.error(e); }
    state.toast = { msg:'Turn skipped \u2014 baton passed on.', until: Date.now()+4000 };
    await advanceShortcut(slug, rs.order[rs.currentIndex % rs.order.length], false);
    await refreshTeamsData();
    render();
  }

  async function toggleSitOut(){
    state.skipRuns = !state.skipRuns;
    await pushLeaderboardEntry();
    await fetchLeaderboard();
    if(state.skipRuns && isActiveRacer()){ await skipTurn(); return; }
    await refreshTeamsData();
    render();
  }

  var METER_REFERENCE_TEAM_SIZE = 4;
  function teamMemberCount(teamName){
    if(!teamName) return METER_REFERENCE_TEAM_SIZE;
    var slug = teamSlug(teamName);
    var count = 0;
    state.leaderboard.forEach(function(e){ if(e.team && teamSlug(e.team) === slug) count++; });
    return count > 0 ? count : METER_REFERENCE_TEAM_SIZE;
  }

  var DIFFICULTY_REP_MULT = { easy: 1, medium: 1.5, hard: 2 };
  function scaledRepsFor(baseReps, difficultyId){
    var mult = DIFFICULTY_REP_MULT[difficultyId] || 1;
    return Math.max(1, Math.round((baseReps || 10) * mult));
  }

  function assignExercise(difficultyId){
    var tlE = timeLeftSec(); if(tlE !== null && tlE <= 0) return;
    if(difficultyId === 'extreme'){
      var extremeEx = findExtremeExercise();
      if(!extremeEx){ alert('No Extreme Challenge is set up for this game.'); return; }
      state.assignedExercise = { difficultyId: 'extreme', exId: extremeEx.id, exName: extremeEx.name, cat: extremeEx.cat, pts: extremeEx.pts, boostPct: extremeEx.boostPct||0, reps: 1, meterPct: 100 };
      state.lastAssignedExId = extremeEx.id;
      render();
      return;
    }
    var tier = difficultyById(difficultyId);
    var pool = activeExercises().filter(function(e){ return e.id !== 'extreme'; });
    if(pool.length === 0){ alert('No exercises are set up for this game.'); return; }
    var freshPool = pool.filter(function(e){ return e.id !== state.lastAssignedExId; });
    if(freshPool.length > 0) pool = freshPool;
    var ex = pool[Math.floor(Math.random()*pool.length)];
    var reps = (ex.cat === 'travel') ? null : scaledRepsFor(ex.reps, difficultyId);
    state.assignedExercise = { difficultyId: difficultyId, exId: ex.id, exName: ex.name, cat: ex.cat, pts: ex.pts, boostPct: ex.boostPct||0, reps: reps, meterPct: tier.meterPct };
    state.lastAssignedExId = ex.id;
    render();
  }

  var MIN_THROW_INTERVAL_MS = 90000;
  async function getLastThrowTime(slug){
    try{ var r = await window.storage.get(K('lastthrow:'+slug), true); return (r && r.value) ? parseFloat(r.value) : 0; }catch(e){ return 0; }
  }

  async function completeAssignedExercise(){
    var a = state.assignedExercise;
    if(!a) return;
    var tlA = timeLeftSec(); if(tlA !== null && tlA <= 0) return;
    var repCount = a.reps || 1;
    var earned = a.pts * repCount * (1 + (a.boostPct||0)/100);
    state.tapEarnings += earned;
    if(state.team){
      var slug = teamSlug(state.team);
      var meter = 0;
      try{ var r = await window.storage.get(K('meter:'+slug), true); meter = (r && r.value) ? parseFloat(r.value) : 0; }catch(e){ meter = 0; }
      var contribution = a.meterPct;
      if(a.difficultyId !== 'extreme'){
        var size = teamMemberCount(state.team);
        contribution = a.meterPct * (METER_REFERENCE_TEAM_SIZE / size);
      }
      meter = Math.min(100, meter + contribution);
      try{ await window.storage.set(K('meter:'+slug), String(meter), true); }catch(e){ console.error(e); }
      if(meter >= 100){
        await refreshTeamsData();
        var lastThrow = await getLastThrowTime(slug);
        if(Date.now() - lastThrow >= MIN_THROW_INTERVAL_MS){
          await autoThrowPowerup();
        }
        // if still on cooldown, the charge stays banked at 100% and the poll loop will fire it once ready
      }
    }
    state.assignedExercise = null;
    await pushLeaderboardEntry();
    await refreshTeamsData();
    render();
  }

  async function tryFireBankedPowerup(){
    if(!state.team) return;
    var slug = teamSlug(state.team);
    var td = state.teamData[slug];
    if(!td || (td.meter||0) < 100) return;
    var lastThrow = await getLastThrowTime(slug);
    if(Date.now() - lastThrow < MIN_THROW_INTERVAL_MS) return;
    await autoThrowPowerup();
  }

  function teamMemberIds(slug){
    var ids = [];
    state.leaderboard.forEach(function(e){ if(e.team && teamSlug(e.team) === slug){ ids.push(e._key.replace(K('leaderboard:'),'')); } });
    return ids;
  }

  function sendPush(deviceIds, title, body, tag){
    if(!deviceIds || deviceIds.length === 0) return;
    for(var i = 0; i < deviceIds.length; i += 100){
      try{
        fetch('/api/push/send', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ deviceIds: deviceIds.slice(i, i + 100), title: title, body: body, tag: tag || 'rr' }) }).catch(function(){});
      }catch(e){}
    }
  }

  // Picks a power-up that makes sense for where the team currently sits, then fires it.
  var throwInFlight = false;
  async function autoThrowPowerup(){
    if(throwInFlight) return false;
    throwInFlight = true;
    try{ return await autoThrowPowerupInner(); }
    finally{ throwInFlight = false; }
  }

  async function autoThrowPowerupInner(){
    if(!state.team) return false;
    var tlT = timeLeftSec(); if(tlT !== null && tlT <= 0) return false;
    var mySlug = teamSlug(state.team);
    var lastThrow = await getLastThrowTime(mySlug);
    if(Date.now() - lastThrow < MIN_THROW_INTERVAL_MS) return false;

    var standings = lapStandings();
    var myIdx = -1;
    standings.forEach(function(t, i){ if(teamSlug(t.name) === mySlug) myIdx = i; });
    if(myIdx < 0) return false;
    var aheadSlug  = myIdx > 0 ? teamSlug(standings[myIdx-1].name) : null;
    var behindSlug = myIdx < standings.length - 1 ? teamSlug(standings[myIdx+1].name) : null;
    var leaderSlug = myIdx > 0 ? teamSlug(standings[0].name) : null;

    function freeTarget(slug){ return slug && state.teamData[slug] && !state.teamData[slug].challenge; }
    var options = [];
    if(freeTarget(behindSlug)){ options.push({ type:'banana', target: behindSlug }); }
    if(freeTarget(aheadSlug)){ options.push({ type:'greenshell', target: aheadSlug }); options.push({ type:'redshell', target: aheadSlug }); }
    if(freeTarget(leaderSlug)){
      var lt = state.teamData[leaderSlug];
      if(lt.racer && lt.racer.order && lt.racer.order.length){ options.push({ type:'blueshell', target: leaderSlug }); }
    }
    var myTd = state.teamData[mySlug];
    // The team in 1st place only ever gets Bananas; Rockets are a catch-up item for everyone else.
    if(myIdx > 0 && !(myTd && myTd.shortcut)){ options.push({ type:'rocket', target: mySlug }); }
    if(options.length === 0) return false;

    var pick = options[Math.floor(Math.random()*options.length)];
    var powerup = powerupById(pick.type);

    // Claim the cooldown slot immediately (re-checking first) so a teammate's phone can't fire at the same moment.
    var claimCheck = await getLastThrowTime(mySlug);
    if(Date.now() - claimCheck < MIN_THROW_INTERVAL_MS) return false;
    var now = Date.now();
    try{ await window.storage.set(K('lastthrow:'+mySlug), String(now), true); }catch(e){ return false; }
    var pushIds = [], pushTitle = '', pushBody = '', toastMsg = '';

    if(pick.type === 'rocket'){
      // The current runner may already be past the turn-off, so the shortcut is saved for the NEXT runner.
      var rl = powerup.label;
      var nextName = nextRunnerNameFor(myTd);
      try{ await window.storage.set(K('shortcut:'+mySlug), JSON.stringify({ issuedAt: now, fromTeam: state.team, state: 'pending' }), true); }catch(e){ console.error(e); return false; }
      state.lastShortcutSeen = now + ':pending';
      pushIds = teamMemberIds(mySlug);
      pushTitle = '\uD83D\uDE80 ' + rl + ' loaded!';
      pushBody = nextName + ' takes the half-lap shortcut on the next lap.';
      toastMsg = rl + ' loaded \u2014 ' + nextName + ' takes the shortcut next lap!';
    } else {
      var targetSlug = pick.target;
      var targetName = state.teamData[targetSlug].name;
      var existing = null;
      try{ var r2 = await window.storage.get(K('challenge:'+targetSlug), true); existing = (r2 && r2.value) ? JSON.parse(r2.value) : null; }catch(e){ existing = null; }
      if(existing) return false;
      var ch;
      if(pick.type === 'blueshell'){
        var rs = state.teamData[targetSlug].racer;
        var runnerId = rs.order[rs.currentIndex % rs.order.length];
        var runnerName = nameForId(runnerId);
        var dest = (state.session && state.session.blueShellDest) || 'the tennis courts';
        ch = { powerupId:'blueshell', kind:'detour', exId:'detour', exName:'Run to '+dest, destination: dest, runnerId: runnerId, runnerName: runnerName,
               cat:'travel', pts:0, boostPct:0, reps:0, issuedAt: now, roster:[runnerId], doneBy:[], fromTeam: state.team, toTeam: targetName };
        pushTitle = '\uD83D\uDD35 ' + powerup.label + '!';
        pushBody = runnerName + ' must run to ' + dest + '.';
      } else {
        var burpee = null;
        activeExercises().forEach(function(e){ if(e.id === 'burpee') burpee = e; });
        var bx = burpee || { id:'burpee', name:'Burpee', cat:'strength', pts:3, boostPct:0 };
        var reps = powerup.attackReps || 5;
        ch = { powerupId: pick.type, kind:'burpees', exId: bx.id, exName: bx.name, cat: bx.cat, pts: bx.pts, boostPct: bx.boostPct||0, reps: reps,
               issuedAt: now, roster: teamMemberIds(targetSlug), doneBy:[], fromTeam: state.team, toTeam: targetName };
        pushTitle = powerup.label + ' incoming!';
        pushBody = state.team + ' hit your team \u2014 everyone does ' + reps + ' \u00D7 ' + bx.name + '.';
      }
      try{ await window.storage.set(K('challenge:'+targetSlug), JSON.stringify(ch), true); }catch(e){ console.error(e); return false; }
      pushIds = teamMemberIds(targetSlug);
      toastMsg = powerup.label + ' sent at ' + targetName + '!';
    }

    try{ await window.storage.set(K('meter:'+mySlug), '0', true); }catch(e){}
    sendPush(pushIds, pushTitle, pushBody, 'powerup');
    state.toast = { msg: toastMsg, until: now + 5000 };
    return true;
  }


  async function confirmChallengeDone(){
    if(!state.team) return;
    var slug = teamSlug(state.team);
    var ch = null;
    try{ var r = await window.storage.get(K('challenge:'+slug), true); ch = (r && r.value) ? JSON.parse(r.value) : null; }catch(e){ ch = null; }
    if(!ch){ state.myChallenge = null; render(); return; }
    if(ch.doneBy.indexOf(state.devicePlayerId) === -1){ ch.doneBy.push(state.devicePlayerId); }
    if(ch.doneBy.length >= ch.roster.length){
      var bonus = (ch.reps||0) * (ch.pts||0) * (1 + (ch.boostPct||0)/100);
      if(bonus > 0){
        var pcbonus = 0;
        try{ var rb = await window.storage.get(K('pcbonus:'+slug), true); pcbonus = (rb && rb.value) ? parseFloat(rb.value) : 0; }catch(e){ pcbonus = 0; }
        pcbonus += bonus;
        try{ await window.storage.set(K('pcbonus:'+slug), String(pcbonus), true); }catch(e){}
      }
      try{ await window.storage.delete(K('challenge:'+slug), true); }catch(e){}
      state.myChallenge = null;
      state.toast = (ch.kind === 'detour')
        ? { msg:'Detour complete — back to racing!', until: Date.now()+5000 }
        : { msg:'Team Challenge Complete! +'+fmtPts(bonus)+' pts to Pit Crew board', until: Date.now()+5000 };
    } else {
      try{ await window.storage.set(K('challenge:'+slug), JSON.stringify(ch), true); }catch(e){}
      state.myChallenge = ch;
    }
    await refreshTeamsData();
    render();
  }

  function timeLeftSec(){
    if(!state.session || !state.session.startTime) return null;
    return state.session.durationSec - (Date.now()-state.session.startTime)/1000;
  }

  function tap(exId, delta){
    var ex = null;
    activeExercises().forEach(function(e){ if(e.id===exId) ex = e; });
    if(!ex) return;
    var left = timeLeftSec();
    if(left !== null && left <= 0) return;
    if(state.gameConfig.hasBoosts){
      if(delta > 0){
        var val = ex.pts * (1 + (ex.boostPct||0)/100);
        state.tapEarnings += val;
        state.reps[exId] = (state.reps[exId]||0) + 1;
      } else if((state.reps[exId]||0) > 0){
        state.reps[exId] -= 1;
        var approx = ex.pts * (1 + (ex.boostPct||0)/100);
        state.tapEarnings = Math.max(0, state.tapEarnings - approx);
      }
    } else {
      var next = (state.reps[exId]||0) + delta;
      if(next < 0) next = 0;
      state.reps[exId] = next;
    }
    var mp = missionProgress();
    if(!state.missionAwarded && mp.done >= mp.total){ state.missionAwarded = true; }
    render();
    pushLeaderboardEntry();
  }

  // One card per team: laps, power meter and power-up points, all as bars.
  function renderTeamProgress(){
    var slugs = Object.keys(state.teamData);

    pitStandings().forEach(function(t){ ptsBySlug[teamSlug(t.name)] = t.score; });

    slugs.forEach(function(sl){

      maxLaps = Math.max(maxLaps, lapsBySlug[sl]);
      maxPts = Math.max(maxPts, ptsBySlug[sl] || 0);

  // ---------- the end of the game: flash, siren, vibration, alert ----------
  var END_FLASH_MS = 10000;
  function showEndFlash(ms){
    var old = document.getElementById('endFlash');
    if(old && old.parentNode){ old.parentNode.removeChild(old); }
    var el = document.createElement('div');
    el.id = 'endFlash'; el.className = 'end-flash';
    el.innerHTML = '<div class="end-flash-text">TIME\'S UP!</div><div class="end-flash-sub">GAME OVER</div>';
    document.body.appendChild(el);
    setTimeout(function(){
      el.className = 'end-flash fade';
      setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, 700);
    }, Math.max(500, ms));
  }
  function playEndAlarm(){
    if(!audioCtx){ unlockAudio(); }
    if(!audioCtx) return;
    try{
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      var now = audioCtx.currentTime, dur = 7;
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(650, now);
      for(var t = 0; t < dur; t += 0.6){
        osc.frequency.linearRampToValueAtTime(1150, now + t + 0.3);
        osc.frequency.linearRampToValueAtTime(650, now + t + 0.6);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
      gain.gain.setValueAtTime(0.4, now + dur - 0.4);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur + 0.05);
    }catch(e){ console.error('end alarm failed', e); }
  }
  // Only the Q's computer sends this, once, so locked phones and watches hear about the finish too.
  async function maybeSendEndPush(endAt){
    var already = null;
    try{ var r = await window.storage.get(K('endpush'), true); already = (r && r.value) ? r.value : null; }catch(e){ already = null; }
    if(already === String(endAt)) return;
    try{ await window.storage.set(K('endpush'), String(endAt), true); }catch(e){}
    var ids = state.leaderboard.map(function(e){ return e._key.replace(K('leaderboard:'), ''); });
    sendPush(ids, "\uD83C\uDFC1 TIME'S UP!", 'The game is over \u2014 check the final standings.', 'gameover');
  }
  function checkGameEnd(){
    if(state.screen !== 'game' || !state.gameConfig || !state.gameConfig.hasRoles) return;
    if(!(state.isQ || state.playerName) || !state.session || !state.session.startTime) return;
    var endAt = state.session.startTime + state.session.durationSec * 1000;
    var now = Date.now();
    if(now < endAt || state.endHandledFor === endAt) return;
    state.endHandledFor = endAt;
    var since = now - endAt;
    if(since < END_FLASH_MS){      // only announce a game that has JUST ended, not one you are opening afterwards
      showEndFlash(END_FLASH_MS - since);
      playEndAlarm();
      try{ if(navigator.vibrate){ navigator.vibrate([600, 200, 600, 200, 600, 200, 900]); } }catch(e){}
      if(state.isQ){ maybeSendEndPush(endAt); }
    }
  }

  function renderGame(){
    var g = state.gameConfig;
    if(g.hasGameCode){
      if(state.isQ){ renderQDashboard(); return; }
      if(!state.playerName){ renderPaxJoin(); return; }
      if(state.session && state.session.startTime && timeLeftSec() <= 0){ renderFinalPax(); return; }
      if(!state.team){ renderPaxWaiting('Waiting for the Q to shuffle teams...'); return; }
      if(!(state.session && state.session.startTime)){ renderPaxWaiting('Waiting for the Q to start the game...'); return; }
      renderGameMarioKart();
      return;
    }
    if(!state.playerName){ renderClassicJoin(); return; }
    if(state.mode === 'random' && !state.team){ renderClassicLobby(); return; }
    renderGameClassic();

  // ---------- remembering your game across a page reload ----------
  var RESUME_KEY = 'rr-resume';
  var RESUME_Q_KEY = 'rr-resume-q';
  function quiet(p){ if(p && p.catch){ p.catch(function(){}); } }
  function saveResume(){
    quiet(window.storage.set(RESUME_KEY, JSON.stringify({ gameId: state.gameId, code: state.code, playerName: state.playerName, savedAt: Date.now() }), false));
  }
  function saveResumeQ(){
    quiet(window.storage.set(RESUME_Q_KEY, JSON.stringify({ gameId: state.gameId, code: state.code, savedAt: Date.now() }), false));
  }
  function clearResume(){
    quiet(window.storage.delete(RESUME_KEY, false));
    quiet(window.storage.delete(RESUME_Q_KEY, false));
  }
  function navigationType(){
    try{
      var nav = (window.performance && window.performance.getEntriesByType) ? window.performance.getEntriesByType('navigation')[0] : null;
      return nav ? nav.type : '';
    }catch(e){ return ''; }
  }
  function reloadPage(){ try{ window.location.reload(); }catch(e){} }

  // iPhones remember what you typed (the code and your name) and offer "Undo Typing" when you shake the phone.
  // Loading the page fresh clears that history, and saveResume() lets the reload drop you straight back in.
  async function reloadAfterJoin(pushDone){
    try{ await Promise.race([pushDone, new Promise(function(r){ setTimeout(r, 12000); })]); }catch(e){}
    try{ if('Notification' in window && Notification.permission === 'default'){ return; } }catch(e){}
    if(state.screen === 'game' && state.playerName && !state.isQ){ reloadPage(); }
  }

  // Players come back to their game; the Q only comes back after a refresh (so a fresh visit starts clean).
  async function tryResume(urlCode, wantsSetup){
    if(wantsSetup) return false;
    var raw = null, asQ = false;
    try{ var r = await window.storage.get(RESUME_KEY, false); raw = (r && r.value) ? JSON.parse(r.value) : null; }catch(e){ raw = null; }
    if(!raw && navigationType() === 'reload'){
      try{ var rq = await window.storage.get(RESUME_Q_KEY, false); raw = (rq && rq.value) ? JSON.parse(rq.value) : null; }catch(e){ raw = null; }
      asQ = !!raw;
    }
    if(!raw || !raw.code || !raw.gameId || !GAMES[raw.gameId]) return false;
    if(asQ && isMobileDevice()) return false;
    if(!asQ && !state.devicePlayerId) return false;   // players need their device ID; the Q never has one
    if(Date.now() - (raw.savedAt || 0) > 6*3600*1000){ clearResume(); return false; }
    if(urlCode && urlCode !== raw.code) return false;

    state.gameId = raw.gameId; state.gameConfig = GAMES[raw.gameId]; state.code = raw.code;
    var sess = null;
    try{ var rs = await window.storage.get(codeKey(raw.code, 'session'), true); sess = (rs && rs.value) ? JSON.parse(rs.value) : null; }catch(e){ sess = null; }
    var over = sess && sess.startTime && (Date.now() > sess.startTime + sess.durationSec*1000 + 15*60*1000);
    if(!sess || over || (!asQ && !raw.playerName)){
      clearResume(); state.gameId = null; state.gameConfig = null; state.code = null; return false;
    }
    state.session = sess; state.screen = 'game'; state.isQ = asQ; state.mode = 'random';
    if(!asQ){ state.playerName = raw.playerName; }
    await fetchTeams(); await fetchLeaderboard();
    if(!asQ){
      state.leaderboard.forEach(function(e){
        if(e._key === K('leaderboard:'+state.devicePlayerId)){
          state.tapEarnings = e.score || 0; state.skipRuns = !!e.skipRuns; if(e.team){ state.team = e.team; }
        }
      });
      await pushLeaderboardEntry();
      await applyMyTeamAssignment();
    }
    await refreshTeamsData();
    if(!asQ){
      await refreshMyChallenge();
      try{ if('Notification' in window && Notification.permission === 'granted'){ setupPush(); } }catch(e){}
    }
    return true;
  }

  async function init(){
    if(!window.storage || typeof window.storage.get !== 'function'){
      app.innerHTML = '<div class="card"><p class="eyebrow" style="color:var(--danger);">Storage Unavailable</p>' +
        '<p style="font-size:13px; line-height:1.5;">This app could not set up its storage layer. Try reloading the page; if it keeps happening, the server may be down.</p></div>';
      return;
    }
    await loadDeviceId();
    state.loading = false;

    var params = new URLSearchParams(window.location.search);
    var joinGame = params.get('join');
    var setupGame = params.get('setup');
    var prefillCode = params.get('code');
    armAudioUnlock();
    var resumed = false;
    try{ resumed = await tryResume((prefillCode || '').toUpperCase(), !!setupGame); }catch(e){ console.error('resume failed', e); resumed = false; }
    if(resumed){
      // straight back into the game
    } else if(setupGame && GAMES[setupGame] && GAMES[setupGame].hasGameCode){
      state.gameId = setupGame;
      state.gameConfig = GAMES[setupGame];
      if(isMobileDevice()){ state.screen = 'gate'; } else { startQSetup(); }
    } else if(joinGame && GAMES[joinGame] && GAMES[joinGame].hasGameCode){
      state.gameId = joinGame;
      state.gameConfig = GAMES[joinGame];
      state.isQ = false;
      state.codeError = null;
      state.prefillCode = prefillCode ? prefillCode.toUpperCase() : null;
      state.screen = 'paxcode';
    }

    render();

    setInterval(async function(){
      if(state.screen === 'game' && state.gameId && state.gameConfig){
        if(state.gameConfig.hasGameCode && !state.code){ return; }
        if(!state.isQ && !state.playerName){ return; }
        await fetchSession(); await fetchTeams();
        if(state.isQ || state.playerName){
          await fetchLeaderboard();
          if(!state.isQ){ await applyMyTeamAssignment(); }
          if(state.gameConfig.hasRoles){
            await refreshTeamsData();
            if(!state.isQ){
              await refreshMyChallenge(); await tryFireBankedPowerup(); await refreshTeamsData();
              var myTd = state.team ? state.teamData[teamSlug(state.team)] : null;
              if(myTd && myTd.shortcut){
                var scState = myTd.shortcut.state || 'active';
                var scKey = myTd.shortcut.issuedAt + ':' + scState;
                if(scKey !== state.lastShortcutSeen){
                  state.lastShortcutSeen = scKey;
                  var rockName = powerupById('rocket').label;
                  if(scState === 'pending'){ notifyPowerupHit(rockName + ' loaded! ' + nextRunnerNameFor(myTd) + ' takes the half-lap shortcut next lap.'); }
                  else if(isActiveRacer()){ notifyPowerupHit(rockName + '! Take the half-lap shortcut this lap.'); }
                }
              }
            }
          }
        }
        render();
      }
    }, 4000);

    setInterval(function(){
      if(state.screen === 'game' && (state.isQ || state.playerName) && state.session && state.session.startTime){ checkGameEnd(); render(); }
    }, 1000);
  }

  init();
})();
</script>
</body>
</html>
